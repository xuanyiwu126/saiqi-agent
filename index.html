<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>赛启｜校园竞赛组队 Agent</title>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#f6f8fc;color:#1f2a44}
    #loading{min-height:100vh;display:grid;place-items:center;color:#667085;font-size:15px}
  </style>
</head>
<body>
  <div id="loading">正在加载赛启产品作品集…</div>
<script>
(async function () {
  try {
    const response = await fetch('./portfolio.html', {cache: 'no-cache'});
    if (!response.ok) throw new Error('portfolio.html load failed');
    const source = await response.text();
    const parsed = new DOMParser().parseFromString(source, 'text/html');

    document.title = parsed.title || '赛启｜校园竞赛组队 Agent';
    document.head.innerHTML = parsed.head.innerHTML;
    document.body.innerHTML = parsed.body.innerHTML;

    const extraStyle = document.createElement('style');
    extraStyle.textContent = `
      .demoGrid{display:grid;grid-template-columns:minmax(260px,.72fr) minmax(0,1.28fr);gap:52px;align-items:center}
      .videoShell{max-width:350px;margin:0 auto;background:#111827;border-radius:14px;padding:12px;box-shadow:0 18px 44px rgba(20,38,79,.13)}
      .videoShell video{display:block;width:100%;max-height:650px;border-radius:8px;background:#000}
      .demoPoints{display:grid;grid-template-columns:1fr 1fr;gap:16px}
      .demoPoint{padding:22px 24px;background:#fff;border:1px solid var(--line);border-radius:10px}
      .demoPoint b{display:block;font-size:17px;margin-bottom:7px;color:var(--ink)}
      .demoPoint p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
      @media(max-width:900px){.demoGrid{grid-template-columns:1fr}.demoPoints{grid-template-columns:1fr 1fr}.videoShell{max-width:330px}}
      @media(max-width:620px){.demoPoints{grid-template-columns:1fr}}
    `;
    document.head.appendChild(extraStyle);

    const nav = document.querySelector('.navlinks');
    if (nav && !nav.querySelector('a[href="#demo"]')) {
      const link = document.createElement('a');
      link.href = '#demo';
      link.textContent = '演示';
      nav.insertBefore(link, nav.firstChild);
    }

    const hero = document.querySelector('.hero');
    if (hero) {
      const section = document.createElement('section');
      section.className = 'section white';
      section.id = 'demo';
      section.innerHTML = `
        <div class="wrap">
          <div class="sectionHead">
            <div class="kicker">产品演示</div>
            <div>
              <h2>完整产品 Demo</h2>
              <p class="lead">演示赛事发现、AI 竞赛顾问推荐、推荐解释以及组队发布与管理的核心流程。</p>
            </div>
          </div>
          <div class="demoGrid">
            <div class="videoShell">
              <video controls preload="metadata" playsinline>
                <source src="./saiqi_demo.mp4" type="video/mp4" />
                当前浏览器不支持视频播放，可在仓库中打开 saiqi_demo.mp4 查看。
              </video>
            </div>
            <div class="demoPoints">
              <div class="demoPoint"><b>赛事发现</b><p>聚合赛事信息与筛选入口，降低跨渠道查找成本。</p></div>
              <div class="demoPoint"><b>主动追问</b><p>读取用户画像，在关键信息不足时进一步补充目标、偏好与投入约束。</p></div>
              <div class="demoPoint"><b>赛事匹配</b><p>结合模型语义匹配与规则评分，输出候选赛事及匹配结果。</p></div>
              <div class="demoPoint"><b>组队行动</b><p>推荐结果继续衔接队伍发布、申请与管理，形成完整任务闭环。</p></div>
            </div>
          </div>
        </div>`;
      hero.insertAdjacentElement('afterend', section);
    }
  } catch (err) {
    document.body.innerHTML = '<div id="loading">页面加载失败，请刷新后重试。</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
